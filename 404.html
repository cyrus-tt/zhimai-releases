<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 — 知脉 ZhiMai</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FCFBF8;--ink:#1A1714;--ink-soft:#4A453E;--mute:#8B847A;--accent:#C8541E;--line:#E9E4D9}
  *{margin:0;box-sizing:border-box}
  body{min-height:100svh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans SC",system-ui,sans-serif;padding:24px;text-align:center}
  .wrap{max-width:480px}
  .code{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(72px,18vw,120px);line-height:1;letter-spacing:-.04em}
  .rule{width:40px;height:3px;background:var(--accent);margin:24px auto;border-radius:2px}
  h1{font-family:"Noto Serif SC",serif;font-weight:600;font-size:clamp(20px,5vw,26px);margin-bottom:12px}
  p{color:var(--ink-soft);line-height:1.7;font-size:15px;margin-bottom:28px}
  a.home{display:inline-block;padding:12px 24px;background:var(--ink);color:var(--bg);text-decoration:none;
    border-radius:10px;font-weight:500;font-size:15px;transition:transform .2s,background .2s}
  a.home:hover{background:var(--accent);transform:translateY(-2px)}
  .foot{margin-top:32px;color:var(--mute);font-size:13px}
  .foot a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <div class="rule"></div>
    <h1>这一页走丢了</h1>
    <p>你要找的内容可能被挪走了，或者链接本身就不太对。<br>回首页看看知脉是什么吧。</p>
    <a class="home" href="/">← 回到首页</a>
    <div class="foot">知脉 ZhiMai · <a href="/">你的私人研究院</a></div>
  </main>
</body>
</html>
